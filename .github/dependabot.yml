version: 2
updates:
  # One grouped PR per ecosystem per week. Dependabot cannot merge npm and
  # GitHub Actions updates into one PR, so max 2 version-update PRs / week.
  # Each PR triggers e2e (Vercel preview quota), so keep this count low.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-weekly:
        patterns: ["*"]
    open-pull-requests-limit: 1
    # Held back: typescript-eslint lacks TS 7 support; react-table 9 drops
    # the v8 API (needs code migration). Remove each rule once ready.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-weekly:
        patterns: ["*"]
    open-pull-requests-limit: 1
