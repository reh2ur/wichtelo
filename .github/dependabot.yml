version: 2
updates:
  # One grouped PR per ecosystem per week. Dependabot cannot merge npm and
  # GitHub Actions updates into one PR, so max 2 version-update PRs / week.
  # Each PR triggers e2e (Vercel preview quota), so keep this count low.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-weekly:
        patterns: ["*"]
    open-pull-requests-limit: 1
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-weekly:
        patterns: ["*"]
    open-pull-requests-limit: 1
