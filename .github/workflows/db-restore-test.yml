name: DB restore test

# Proves the dump -> restore path (pg_dump custom format, pg_restore) works on
# this schema. Uses an ephemeral local Supabase stack, NOT prod data and NOT
# the encrypted prod artefacts (private age key is never in CI).
on:
  schedule:
    - cron: "11 4 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-restore-test
  cancel-in-progress: false

jobs:
  restore:
    name: Dump and restore local schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGPASSWORD: postgres
      SRC: postgresql://postgres@127.0.0.1:54322/postgres
      PGBIN: /usr/lib/postgresql/17/bin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep version in sync with devDependency `supabase` in package.json.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Install postgresql-client-17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Start local Supabase (applies migrations)
        run: supabase start

      # Seed one auth user + profile so row counts are not all zero.
      - name: Seed canary rows
        run: |
          "$PGBIN/psql" "$SRC" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, instance_id, aud, role, email)
          values ('00000000-0000-0000-0000-0000000000aa', '00000000-0000-0000-0000-000000000000',
                  'authenticated', 'authenticated', 'restore-canary@example.invalid');
          insert into public.profiles (id, first_name, last_name)
          values ('00000000-0000-0000-0000-0000000000aa', 'Restore', 'Canary');
          SQL

      - name: Dump (same flags as db-backup)
        run: |
          "$PGBIN/pg_dump" "$SRC" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --file="$RUNNER_TEMP/restore.dump"

      - name: Restore into fresh database
        run: |
          "$PGBIN/psql" "$SRC" -v ON_ERROR_STOP=1 -c 'drop database if exists restore_test' -c 'create database restore_test template template0'
          # Fresh db lacks Supabase-provided schema/roles bits: create the auth
          # schema + extensions the dump references, then restore the rest.
          DST=postgresql://postgres@127.0.0.1:54322/restore_test
          "$PGBIN/psql" "$DST" -v ON_ERROR_STOP=1 -c 'create schema if not exists extensions' -c 'create extension if not exists pgcrypto with schema extensions' -c 'create extension if not exists "uuid-ossp" with schema extensions'
          # Non-zero exit tolerated (benign Supabase-owned object warnings);
          # the comparison step below is the real gate.
          "$PGBIN/pg_restore" --no-owner --no-privileges \
            --dbname="$DST" "$RUNNER_TEMP/restore.dump" || echo "::warning::pg_restore reported errors, see log"

      - name: Compare row counts + objects
        run: |
          DST=postgresql://postgres@127.0.0.1:54322/restore_test
          q() { "$PGBIN/psql" "$1" -XAtq -v ON_ERROR_STOP=1 -c "$2"; }
          fail=0
          # Exact count per table: public tables + auth.users.
          tables=$(q "$SRC" "select quote_ident(schemaname)||'.'||quote_ident(tablename) from pg_tables where schemaname='public' union all select 'auth.users' order by 1")
          [ -n "$tables" ] || { echo "::error::No tables found"; exit 1; }
          for t in $tables; do
            a=$(q "$SRC" "select count(*) from $t")
            b=$(q "$DST" "select count(*) from $t")
            echo "$t src=$a restored=$b"
            [ "$a" = "$b" ] || { echo "::error::Row count mismatch in $t"; fail=1; }
          done
          profiles=$(q "$DST" "select count(*) from public.profiles where last_name='Canary'")
          [ "$profiles" = "1" ] || { echo "::error::Canary profile missing after restore"; fail=1; }
          # Schema objects survive: functions (perform_draw etc.) + RLS flags.
          fa=$(q "$SRC" "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'")
          fb=$(q "$DST" "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'")
          echo "public functions src=$fa restored=$fb"
          [ "$fa" = "$fb" ] || { echo "::error::Function count mismatch"; fail=1; }
          ra=$(q "$SRC" "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relrowsecurity")
          rb=$(q "$DST" "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relrowsecurity")
          echo "RLS-enabled tables src=$ra restored=$rb"
          [ "$ra" = "$rb" ] && [ "$ra" -gt 0 ] || { echo "::error::RLS flag mismatch"; fail=1; }
          exit $fail
