name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *" # daily, well under Supabase's 7-day pause threshold
  workflow_dispatch:

# Publishable key only — never put service-role key in CI for a ping.
permissions: {}

jobs:
  ping:
    name: Ping ${{ matrix.env }} Supabase project
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [staging, production]
      fail-fast: false
    steps:
      - name: Query a table via PostgREST to reset Supabase inactivity timer
        env:
          SUPABASE_URL: ${{ matrix.env == 'staging' && secrets.SUPABASE_URL_STAGING || secrets.SUPABASE_URL_PROD }}
          SUPABASE_KEY: ${{ matrix.env == 'staging' && secrets.SUPABASE_PUBLISHABLE_KEY_STAGING || secrets.SUPABASE_PUBLISHABLE_KEY_PROD }}
        run: |
          # Root /rest/v1/ (OpenAPI schema) answers 401 for publishable keys; a
          # real table read with RLS applied (anon sees 0 rows) does not.
          status=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/groups?select=id&limit=1")
          echo "Response status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Keep-alive ping failed for ${{ matrix.env }} (HTTP $status)"
            cat /tmp/body
            exit 1
          fi
