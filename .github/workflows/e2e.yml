name: E2E

on:
  pull_request:

jobs:
  e2e:
    name: Playwright E2E (Vercel preview)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      # Match the deployment to the exact PR head commit — the first bot
      # comment keeps pointing at the previous deployment after later pushes.
      - name: Wait for Vercel preview deployment (head SHA)
        id: vercel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PREVIEW_URL=""

          for i in $(seq 1 60); do
            # Newest first. Vercel names the environment "Preview" (or
            # "Preview – <project>"), so match by prefix.
            IDS=$(gh api "/repos/$REPO/deployments?sha=$SHA&per_page=100" \
              --jq '[.[] | select(.environment | startswith("Preview")) | .id][]')

            for ID in $IDS; do
              STATUS=$(gh api "/repos/$REPO/deployments/$ID/statuses?per_page=1" \
                --jq '.[0] // empty | "\(.state) \(.environment_url // .target_url // "")"')
              STATE="${STATUS%% *}"
              URL="${STATUS#* }"

              if [ "$STATE" = "success" ] && [ -n "$URL" ]; then
                PREVIEW_URL="$URL"
                break 2
              fi
              if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
                echo "Vercel deployment $ID for $SHA ended in state '$STATE'."
                exit 1
              fi
            done

            echo "Attempt $i/60 — no successful Preview deployment for $SHA yet, waiting 10s..."
            sleep 10
          done

          if [ -z "$PREVIEW_URL" ]; then
            echo "Timed out waiting for Vercel Preview deployment of $SHA."
            exit 1
          fi

          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $PREVIEW_URL"

      - name: Run Playwright tests
        id: playwright
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.vercel.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}
        run: pnpm e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Post E2E results to PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'playwright-report/results.json';

            if (!fs.existsSync(resultsPath)) {
              console.log('No results.json — skipping PR comment');
              return;
            }

            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            const { stats } = results;

            function collectFailed(suites) {
              const failed = [];
              for (const suite of suites ?? []) {
                for (const spec of suite.specs ?? []) {
                  if (spec.tests.some(t => t.status === 'unexpected')) {
                    failed.push(spec.title);
                  }
                }
                failed.push(...collectFailed(suite.suites));
              }
              return failed;
            }

            const failedTests = collectFailed(results.suites);
            const passed  = stats.expected   ?? 0;
            const failed  = stats.unexpected ?? 0;
            const flaky   = stats.flaky      ?? 0;
            const skipped = stats.skipped    ?? 0;

            const icon   = failed > 0 ? '❌' : '✅';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            let body = `## ${icon} E2E Results\n\n`;
            body += `| ✅ Passed | ❌ Failed | ⚠️ Flaky | ⏭️ Skipped |\n`;
            body += `|----------|----------|----------|----------|\n`;
            body += `| ${passed} | ${failed} | ${flaky} | ${skipped} |\n\n`;
            body += `[View full report](${runUrl})\n`;

            if (failedTests.length > 0) {
              body += `\n<details><summary>Failed tests (${failedTests.length})</summary>\n\n`;
              body += failedTests.map(t => `- \`${t}\``).join('\n');
              body += '\n</details>\n';
            }

            const marker   = '<!-- pw-e2e-results -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body:       fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body:         fullBody,
              });
            }

  # Super-admin specs need SUPER_ADMIN_EMAIL on the server, which the shared
  # staging project behind Vercel previews does not set. Run them against a
  # production build of this PR on a local Supabase stack instead.
  e2e-admin:
    name: Playwright E2E (admin, local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SUPER_ADMIN_EMAIL: e2e-super-admin@test.local
      E2E_TEST_MODE: "1"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      # Not a Vercel runtime: VERCEL_ENV=preview makes the production build
      # use the dev-style env schema and dry-run mail client (lib/env.ts,
      # lib/email/index.ts) instead of demanding live prod secrets.
      VERCEL_ENV: preview

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Keep version in sync with devDependency `supabase` in package.json.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Start local Supabase (applies migrations)
        run: supabase start

      # Same wiring as the db-lint job in ci.yml, plus a throwaway E2E secret
      # (the stack is ephemeral, so no repo secret needed).
      - name: Export local Supabase env
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          get() { grep -E "^$1=" "$RUNNER_TEMP/supabase.env" | head -n1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//'; }
          URL=$(get API_URL)
          ANON=$(get ANON_KEY)
          SERVICE=$(get SERVICE_ROLE_KEY)
          for v in URL ANON SERVICE; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing $v in 'supabase status -o env' output"
              exit 1
            fi
          done
          SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$ANON"
          echo "::add-mask::$SERVICE"
          echo "::add-mask::$SECRET"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
            echo "E2E_TEST_SECRET=$SECRET"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/supabase.env"

      - name: Build
        run: pnpm build

      - name: Start app
        run: |
          nohup pnpm start > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "App up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::App did not start"
          cat "$RUNNER_TEMP/next.log"
          exit 1

      # admin.spec.ts holds the super-admin access check; the three others
      # are the dashboard/groups/users flows. Fail if any was skipped
      # (unset SUPER_ADMIN_EMAIL would silently skip them again).
      - name: Run super-admin Playwright specs
        env:
          # Outside playwright-report/: the html reporter wipes that folder.
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/pw-admin.json
        run: pnpm exec playwright test e2e/admin --reporter=list,github,html,json

      - name: Fail if any admin spec was skipped
        run: |
          skipped=$(node -e 'console.log(require(process.argv[1]).stats.skipped)' "$RUNNER_TEMP/pw-admin.json")
          echo "Skipped tests: $skipped"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped admin spec(s) skipped — SUPER_ADMIN_EMAIL wiring broke"
            exit 1
          fi

      - name: Show app log on failure
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/next.log" || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-admin
          path: playwright-report/
          retention-days: 7
