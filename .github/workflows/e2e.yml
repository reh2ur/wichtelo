name: E2E

on:
  pull_request:

jobs:
  e2e:
    name: Playwright E2E (Vercel preview)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Wait for Vercel preview URL (from bot comment)
        id: vercel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          PREVIEW_URL=""

          for i in $(seq 1 30); do
            PREVIEW_URL=$(gh api "/repos/$REPO/issues/$PR/comments" \
              --jq '[.[] | select(.user.login == "vercel[bot]") | .body
                    | capture("\\[Preview\\]\\((?P<url>https://[^)]+vercel\\.app[^)]*)\\)")
                    | .url][0] // empty')

            if [ -n "$PREVIEW_URL" ]; then
              echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
              echo "Preview URL: $PREVIEW_URL"
              break
            fi

            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done

          if [ -z "$PREVIEW_URL" ]; then
            echo "Timed out waiting for Vercel preview URL in PR comments."
            exit 1
          fi

      - name: Run Playwright tests
        id: playwright
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.vercel.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}
        run: pnpm e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Post E2E results to PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'playwright-report/results.json';

            if (!fs.existsSync(resultsPath)) {
              console.log('No results.json — skipping PR comment');
              return;
            }

            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            const { stats } = results;

            function collectFailed(suites) {
              const failed = [];
              for (const suite of suites ?? []) {
                for (const spec of suite.specs ?? []) {
                  if (spec.tests.some(t => t.status === 'unexpected')) {
                    failed.push(spec.title);
                  }
                }
                failed.push(...collectFailed(suite.suites));
              }
              return failed;
            }

            const failedTests = collectFailed(results.suites);
            const passed  = stats.expected   ?? 0;
            const failed  = stats.unexpected ?? 0;
            const flaky   = stats.flaky      ?? 0;
            const skipped = stats.skipped    ?? 0;

            const icon   = failed > 0 ? '❌' : '✅';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            let body = `## ${icon} E2E Results\n\n`;
            body += `| ✅ Passed | ❌ Failed | ⚠️ Flaky | ⏭️ Skipped |\n`;
            body += `|----------|----------|----------|----------|\n`;
            body += `| ${passed} | ${failed} | ${flaky} | ${skipped} |\n\n`;
            body += `[View full report](${runUrl})\n`;

            if (failedTests.length > 0) {
              body += `\n<details><summary>Failed tests (${failedTests.length})</summary>\n\n`;
              body += failedTests.map(t => `- \`${t}\``).join('\n');
              body += '\n</details>\n';
            }

            const marker   = '<!-- pw-e2e-results -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body:       fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body:         fullBody,
              });
            }
